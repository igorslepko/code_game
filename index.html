<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta property="og:title" content="code game">
<meta property="og:description" content="test">
<meta property="og:type" content="tbd">
<title>code_game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #050505;
    --text: #0f0;
    --dim: #0a3a0a;
    --error: #ff003c;
    --cyan: #00f0ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Эффект CRT-монитора */
  body::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }

  /* Сетка на фоне */
  .grid-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(var(--dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--dim) 1px, transparent 1px);
    background-size: 20px 20px;
    opacity: 0.15;
    z-index: 0;
  }

  /* Стартовый экран */
  #start-screen {
    z-index: 10;
    text-align: center;
  }
  
  .glitch-btn {
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    font-family: inherit;
    font-size: 2rem;
    padding: 15px 40px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 5px;
    transition: all 0.2s;
    box-shadow: 0 0 10px var(--cyan), inset 0 0 10px var(--cyan);
  }
  .glitch-btn:hover {
    background: var(--cyan);
    color: var(--bg);
    box-shadow: 0 0 30px var(--cyan), inset 0 0 20px var(--cyan);
  }

  /* Игровое поле */
  #game-area {
    display: none;
    z-index: 10;
    width: 100%;
    max-width: 800px;
    padding: 20px;
    flex-direction: column;
    gap: 20px;
  }

  .console-box {
    border: 1px solid var(--text);
    padding: 20px;
    background: rgba(0, 20, 0, 0.5);
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
  }

  .prompt { color: var(--text); margin-bottom: 10px; }

  input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--text);
    color: var(--text);
    font-family: inherit;
    font-size: 1.2rem;
    padding: 5px;
    outline: none;
    caret-color: var(--text);
  }

  .error-msg {
    color: var(--error);
    display: none;
    margin-top: 10px;
    font-size: 0.9rem;
  }

  /* Бинарный код и слоты */
  #puzzle-area {
    display: none;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    animation: fadeIn 0.5s ease-in;
  }

  .binary-string {
    font-size: 1.5rem;
    letter-spacing: 3px;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
    text-align: center;
    word-break: break-all;
  }

  .slots-container { display: flex; gap: 15px; }

  .slot {
    width: 50px; height: 60px;
    border: 2px solid var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; color: var(--text);
    background: rgba(0,0,0,0.8);
    cursor: pointer;
    user-select: none;
  }
  .slot:hover { border-color: var(--cyan); color: var(--cyan); }

  /* Змейка */
  .snake-segment {
    position: absolute;
    width: 20px; 
    height: 20px;
    background: var(--text);
    box-shadow: 0 0 8px var(--text);
    z-index: 5;
    display: none;
    border-radius: 0;
  }

  /* Модальное окно */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,8,16,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #0a0a0a;
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 50px rgba(245,197,66,.25);
  }
  .modal h2 { color: var(--gold); margin-bottom: 20px; }
  .modal .cipher-text {
    font-size: 1.2rem;
    color: #6ee7b7;
    letter-spacing: 2px;
    margin: 20px 0;
    font-family: monospace;
    background: #111;
    padding: 15px;
    border-radius: 8px;
  }
  .modal img { max-width: 120px; margin-bottom: 15px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<!-- Стартовый экран -->
<div id="start-screen">
  <button class="glitch-btn" id="startBtn">START</button>
</div>

<!-- Игровая зона -->
<div id="game-area">
  <div class="console-box">
    <div class="prompt">user@root:~$ <span style="color:#888">Enter command to bypass security...</span></div>
    <input type="text" id="commandInput" autocomplete="off" spellcheck="false">
    <div class="error-msg" id="errorMsg">Error 403: Forbidden. Access Denied.</div>
  </div>

  <div id="puzzle-area">
    <div class="binary-string" id="binaryString"></div>
    <div class="slots-container" id="slotsContainer"></div>
  </div>
</div>

<!-- Модальное окно -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
  // ==========================================
  // 1. ЭЛЕМЕНТЫ
  // ==========================================
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('startBtn');
  const gameArea = document.getElementById('game-area');
  const commandInput = document.getElementById('commandInput');
  const errorMsg = document.getElementById('errorMsg');
  const puzzleArea = document.getElementById('puzzle-area');
  const binaryString = document.getElementById('binaryString');
  const slotsContainer = document.getElementById('slotsContainer');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalContent = document.getElementById('modalContent');

  // ==========================================
  // 2. ЛОГИКА ЗМЕЙКИ
  // ==========================================
  function runSnake() {
    const body = document.body;
    const segments = [];
    const numSegments = 15; 
    
    for (let i = 0; i < numSegments; i++) {
      const seg = document.createElement('div');
      seg.className = 'snake-segment';
      seg.style.display = 'block';
      if (i > 0) seg.style.opacity = (1 - (i / numSegments) * 0.5).toString();
      body.appendChild(seg);
      segments.push(seg);
    }

    let headX = -100; 
    let headY = 100; 
    const step = 20; 
    
    let history = [];
    for (let i = 0; i < numSegments; i++) {
      history.push({ x: headX, y: headY });
    }

    let dir = { x: 1, y: 0 }; 
    let stepsInDir = 0;
    const maxStepsInDir = 8;  

    const interval = setInterval(() => {
      headX += dir.x * step;
      headY += dir.y * step;

      history.unshift({ x: headX, y: headY });
      if (history.length > numSegments) history.pop();

      segments.forEach((seg, i) => {
        const pos = history[i];
        if (pos) {
          seg.style.left = pos.x + 'px';
          seg.style.top = pos.y + 'px';
        }
      });

      stepsInDir++;
      if (stepsInDir >= maxStepsInDir) {
        stepsInDir = 0;
        if (dir.x === 1) dir = { x: 0, y: 1 };
        else if (dir.y === 1) dir = { x: 1, y: 0 };
      }

      if (headX > window.innerWidth + 200 || headY > window.innerHeight + 200) {
        clearInterval(interval);
        segments.forEach(s => s.remove());
        
        gameArea.style.display = 'flex';
        commandInput.focus();
      }
    }, 120); 
  }

  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    runSnake();
  });

  // ==========================================
  // 3. ФУНКЦИЯ ХЭШИРОВАНИЯ
  // ==========================================
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ==========================================
  // 4. ПРОВЕРКА КОМАНДЫ
  // ==========================================
  const CORRECT_HASH = "7c9d4413c88360355a93ddbb39bd3aa0762db5b1da399e9c25430796ed1b4f58";

  commandInput.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      const val = commandInput.value.trim();
      const inputHash = await sha256(val);
      
      if (inputHash === CORRECT_HASH) {
        errorMsg.style.display = 'none';
        commandInput.disabled = true;
        commandInput.style.borderColor = 'var(--cyan)';
        
        const acceptMsg = document.createElement('div');
        acceptMsg.style.color = 'var(--cyan)';
        acceptMsg.style.marginTop = '10px';
        acceptMsg.innerText = "Output: accepted";
        document.querySelector('.console-box').appendChild(acceptMsg);

        setTimeout(() => {
          showPuzzle();
        }, 1000);
      } else {
        errorMsg.style.display = 'block';
        commandInput.value = '';
      }
    }
  });

  // ==========================================
  // 5. ПОКАЗ ПАЗЛА
  // ==========================================
  const BINARY_STRING = "00000001 00001001 00001001 00000001";
  const CORRECT_PUZZLE_HASH = "8e9b669109df89620b94f2387dc53206a82ddc71d658f8f7a2b3a9b417370d3e"; 

  function showPuzzle() {
    puzzleArea.style.display = 'flex';
    binaryString.innerText = BINARY_STRING;

    slotsContainer.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.index = i;
      slot.dataset.value = '0'; 
      slot.innerText = '0';
      
      slot.addEventListener('click', () => {
        let currentVal = parseInt(slot.dataset.value);
        currentVal = (currentVal + 1) % 10;
        slot.dataset.value = currentVal;
        slot.innerText = currentVal;
        checkPuzzle();
      });

      slotsContainer.appendChild(slot);
    }
  }

  // ==========================================
  // 6. ПРОВЕРКА ПАЗЛА
  // ==========================================
  async function checkPuzzle() {
    const slots = slotsContainer.querySelectorAll('.slot');
    let inputStr = "";
    
    slots.forEach(slot => {
      inputStr += slot.dataset.value;
    });

    const inputHash = await sha256(inputStr);

    if (inputHash === CORRECT_PUZZLE_HASH) {
      slots.forEach(slot => {
        slot.style.borderColor = 'var(--cyan)';
        slot.style.color = 'var(--cyan)';
        slot.style.boxShadow = '0 0 10px var(--cyan)';
      });
      
      setTimeout(() => {
        showFinalStage();
      }, 800);
    }
  }

      }
    };
    request.onsuccess = (e) => {
      const db = e.target.result;
      const tx = db.transaction("images", "readwrite");
      const store = tx.objectStore("images");
      store.put(caesarBlob, "caesar_pic"); 
    };

    // 7. Показываем модальное окно (без кнопок!)
    modalContent.innerHTML = `
      <h2>Security Bypassed</h2>
      <img src="${cookieBase64}" alt="Cookie">
      <div class="cipher-text">${encryptedText}</div>
    `;
    modalOverlay.classList.add('show');
  }
</script>
